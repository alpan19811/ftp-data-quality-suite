services:
  postgres:
    image: postgres:16
    container_name: ftp_dq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ftp_dq
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d ftp_dq"]
      interval: 5s
      timeout: 5s
      retries: 5